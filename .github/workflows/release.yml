# KeePass Fluent Theme - automatische Bereitstellung der FluentTheme.dll
# Ausloeser:
# - Änderung von keepass.version auf main: Release zur neuen Version bauen und anlegen.
#   Existiert es schon, wird nichts neu gebaut, nur der Release-Text aufgefrischt.
# - Änderung dieser Datei auf main: Release-Texte aller vorhandenen Releases auffrischen.
# - Hand-Start über "Run workflow" (optional mit Version).
# Release-Text: oben "Änderungen" = Zeilen mit "- " aus dem neuesten Commit, dessen
# Text die Version nennt (Commit "Fluent Theme <Version> – Änderungen"), darunter die Installation.

name: Release

on:
  push:
    branches: [main]
    paths:
      - keepass.version
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 0.67.2026.1101 (leer = aus keepass.version)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie, um den Commit zur Version zu finden

      - name: Versionen bestimmen
        id: ver
        shell: pwsh
        run: |
          $existing = @(gh release list --limit 200 --json tagName --jq '.[].tagName' | ForEach-Object { $_.TrimStart('v') })
          $changed = @(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>$null)
          $v = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $v = '${{ github.event.inputs.version }}'.Trim().TrimStart('v') }
          if (-not $v -and (('${{ github.event_name }}' -eq 'workflow_dispatch') -or ($changed -contains 'keepass.version'))) {
            $line = Get-Content keepass.version | Where-Object { $_ -match '^Fluent Theme:' } | Select-Object -First 1
            if (-not $line) { throw 'keine Version in keepass.version' }
            $v = $line.Split(':')[1].Trim()
          }
          $new = ''
          if ($v) {
            if ($v -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Ungültige Version: $v" }
            if ($existing -notcontains $v) { $new = $v }
          }
          # Ohne Version (nur der Workflow wurde geändert): alle Release-Texte auffrischen
          $refresh = if ($v) { @($existing | Where-Object { $_ -eq $v }) } else { $existing }
          "new=$new" >> $env:GITHUB_OUTPUT
          "refresh=$($refresh -join ' ')" >> $env:GITHUB_OUTPUT
          Write-Host "Neu: '$new' / Text auffrischen: '$($refresh -join ' ')'"

      - name: Release-Texte erstellen
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()   # Umlaute aus git richtig lesen
          New-Item -ItemType Directory -Path 'notes' -Force | Out-Null
          $all = @('${{ steps.ver.outputs.new }}') + ('${{ steps.ver.outputs.refresh }}' -split ' ') | Where-Object { $_ }
          foreach ($ver in $all) {
            # "Änderungen" = Zeilen mit "- " aus dem neuesten Commit, dessen Text die Version nennt
            $sha = git log --format=%H -F --grep="$ver" -n 1
            if (-not $sha) { $sha = git rev-parse HEAD }
            $body = git log -1 --format=%b $sha
            $items = @($body -split "`r?`n" | Where-Object { $_ -match '^\s*[-*] ' } | ForEach-Object { '- ' + ($_.Trim() -replace '^[-*]\s+', '') })
            if ($items.Count -eq 0) { $items = @('- siehe Liesmich.txt im Repository') }
            $lines = @('## Änderungen', '') + $items + @(
              '',
              '## Installation',
              '',
              '1. `FluentTheme.dll` herunterladen.',
              '2. KeePass beenden und die DLL in den Ordner `Plugins` von KeePass kopieren, z. B. `C:\Program Files (x86)\KeePass\Plugins`. Bei einem Update die vorhandene `FluentTheme.dll` einfach ersetzen.',
              '3. KeePass starten. Das Design passt sich automatisch an hell/dunkel und die Windows-Akzentfarbe an; Einstellungen unter Extras › Fluent-Design.',
              '',
              'Voraussetzung: KeePass 2.x unter Windows 10 oder 11 (runde Ecken und einige Details nur unter Windows 11). Ausführliche Beschreibung: README und `Liesmich.txt` im Repository.',
              '',
              '**Installation (English):** close KeePass, copy `FluentTheme.dll` into the `Plugins` folder of KeePass (e.g. `C:\Program Files (x86)\KeePass\Plugins`) and start KeePass. To update, simply replace the existing `FluentTheme.dll`.'
            )
            $lines | Set-Content -Path "notes\$ver.md" -Encoding utf8   # pwsh 7: UTF-8 ohne BOM
            Write-Host "---- $ver"; Get-Content "notes\$ver.md"
          }

      - name: KeePass installieren (nur als Verweis zum Kompilieren)
        if: steps.ver.outputs.new != ''
        shell: pwsh
        run: |
          choco install keepass -y --no-progress
          $kp = Get-ChildItem 'C:\Program Files*' -Recurse -Filter KeePass.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $kp) { throw 'KeePass.exe nicht gefunden' }
          "KPEXE=$($kp.FullName)" >> $env:GITHUB_ENV

      - name: Kompilieren
        if: steps.ver.outputs.new != ''
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.new }}'
          @(
            "[assembly: System.Reflection.AssemblyVersion(""$ver"")]"
            "[assembly: System.Reflection.AssemblyFileVersion(""$ver"")]"
            "[assembly: System.Reflection.AssemblyInformationalVersion(""$ver"")]"
            "namespace FluentTheme { public static partial class AppInfo { public const string Version = ""$ver""; } }"
          ) | Set-Content Quellcode\VersionInfo.cs -Encoding utf8
          New-Item -ItemType Directory -Force Bin | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:library /optimize+ /codepage:65001 /out:Bin\FluentTheme.dll `
            "/resource:Resources\GS-Logo.png,GS-Logo.png" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            "/r:$env:KPEXE" Quellcode\*.cs
          if ($LASTEXITCODE -ne 0) { throw 'Kompilieren fehlgeschlagen' }
          (Get-Item Bin\FluentTheme.dll).VersionInfo.FileVersion

      - name: Release anlegen
        if: steps.ver.outputs.new != ''
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.new }}'
          gh release create "v$ver" Bin\FluentTheme.dll --title "Fluent Theme $ver" --notes-file "notes\$ver.md" --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht angelegt werden' }

      - name: Release-Texte auffrischen
        if: steps.ver.outputs.refresh != ''
        shell: pwsh
        run: |
          foreach ($ver in ('${{ steps.ver.outputs.refresh }}' -split ' ' | Where-Object { $_ })) {
            gh release edit "v$ver" --notes-file "notes\$ver.md"
            if ($LASTEXITCODE -ne 0) { throw "Release-Text v$ver konnte nicht aktualisiert werden" }
          }
