# KeePass Fluent Theme - automatische Bereitstellung der FluentTheme.dll
# Bei jedem Lauf:
# - Für jede Version aus der Geschichte von keepass.version, zu der es noch kein Release
#   gibt, wird die DLL aus genau diesem Stand gebaut und das Release angelegt (älteste zuerst).
# - Die Release-Texte aller vorhandenen Releases werden aufgefrischt.
# Ausloeser: Änderung von keepass.version oder dieser Datei auf main, Hand-Start über "Run workflow".
# Release-Text: oben "Änderungen" = Zeilen mit "- " aus dem neuesten Commit, dessen
# Text die Version nennt (Commit "KeePass Fluent Theme <Version> – Änderungen"), darunter die Installation.

name: Release

on:
  push:
    branches: [main]
    paths:
      - keepass.version
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie: Versionen und Commits zur Version finden

      - name: Versionen bestimmen
        id: ver
        shell: pwsh
        run: |
          $existing = @(gh release list --limit 200 --json tagName --jq '.[].tagName' | ForEach-Object { $_.TrimStart('v') })
          # Versionen aus der Geschichte von keepass.version (jeweils der erste Commit mit dieser Version)
          $build = New-Object System.Collections.Generic.List[string]
          $seen = @{}
          foreach ($sha in @(git log --format=%H --reverse -- keepass.version)) {
            $line = git show "${sha}:keepass.version" | Where-Object { $_ -match '^Fluent Theme:' } | Select-Object -First 1
            if (-not $line) { continue }
            $v = $line.Split(':')[1].Trim()
            if (($v -notmatch '^\d+\.\d+\.\d+\.\d+$') -or $seen.ContainsKey($v)) { continue }
            $seen[$v] = $true
            if ($existing -notcontains $v) { $build.Add("$v=$sha") }
          }
          "build=$($build -join ' ')" >> $env:GITHUB_OUTPUT
          "refresh=$($existing -join ' ')" >> $env:GITHUB_OUTPUT
          Write-Host "Neu bauen: '$($build -join ' ')' / Text auffrischen: '$($existing -join ' ')'"

      - name: Release-Texte erstellen
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()   # Umlaute aus git richtig lesen
          New-Item -ItemType Directory -Path 'notes' -Force | Out-Null
          $all = @('${{ steps.ver.outputs.build }}' -split ' ' | Where-Object { $_ } | ForEach-Object { $_.Split('=')[0] }) +
            @('${{ steps.ver.outputs.refresh }}' -split ' ' | Where-Object { $_ })
          foreach ($ver in $all) {
            # "Änderungen" = Zeilen mit "- " aus dem neuesten Commit, dessen Text die Version nennt
            $sha = git log --format=%H -F --grep="$ver" -n 1
            if (-not $sha) { $sha = git rev-parse HEAD }
            $body = git log -1 --format=%b $sha
            $items = @($body -split "`r?`n" | Where-Object { $_ -match '^\s*[-*] ' } | ForEach-Object { '- ' + ($_.Trim() -replace '^[-*]\s+', '') })
            if ($items.Count -eq 0) { $items = @('- siehe Liesmich.txt im Repository') }
            $lines = @('## Änderungen', '') + $items + @(
              '',
              '## Installation',
              '',
              '1. `FluentTheme.dll` herunterladen.',
              '2. KeePass beenden und die DLL in den Ordner `Plugins` von KeePass kopieren, z. B. `C:\Program Files (x86)\KeePass\Plugins`. Bei einem Update die vorhandene `FluentTheme.dll` einfach ersetzen.',
              '3. KeePass starten. Das Design passt sich automatisch an hell/dunkel und die Windows-Akzentfarbe an; Einstellungen unter Extras › Fluent-Design.',
              '',
              'Voraussetzung: KeePass 2.x unter Windows 10 oder 11 (runde Ecken und einige Details nur unter Windows 11). Ausführliche Beschreibung: README und `Liesmich.txt` im Repository.',
              '',
              '**Installation (English):** close KeePass, copy `FluentTheme.dll` into the `Plugins` folder of KeePass (e.g. `C:\Program Files (x86)\KeePass\Plugins`) and start KeePass. To update, simply replace the existing `FluentTheme.dll`.'
            )
            $lines | Set-Content -Path "notes\$ver.md" -Encoding utf8   # pwsh 7: UTF-8 ohne BOM
            Write-Host "---- $ver"; Get-Content "notes\$ver.md"
          }

      - name: KeePass installieren (nur als Verweis zum Kompilieren)
        if: steps.ver.outputs.build != ''
        shell: pwsh
        run: |
          choco install keepass -y --no-progress
          $kp = Get-ChildItem 'C:\Program Files*' -Recurse -Filter KeePass.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $kp) { throw 'KeePass.exe nicht gefunden' }
          "KPEXE=$($kp.FullName)" >> $env:GITHUB_ENV

      - name: Fehlende Releases bauen und anlegen
        if: steps.ver.outputs.build != ''
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          foreach ($pair in ('${{ steps.ver.outputs.build }}' -split ' ' | Where-Object { $_ })) {
            $ver, $sha = $pair.Split('=')
            Write-Host "==== v$ver aus $sha"
            # Stand dieser Version in einem eigenen Ordner auschecken
            $wt = Join-Path $env:RUNNER_TEMP "src-$ver"
            git worktree add --detach $wt $sha
            if ($LASTEXITCODE -ne 0) { throw "Stand $sha nicht auscheckbar" }
            @(
              "[assembly: System.Reflection.AssemblyVersion(""$ver"")]"
              "[assembly: System.Reflection.AssemblyFileVersion(""$ver"")]"
              "[assembly: System.Reflection.AssemblyInformationalVersion(""$ver"")]"
              "namespace FluentTheme { public static partial class AppInfo { public const string Version = ""$ver""; } }"
            ) | Set-Content "$wt\Quellcode\VersionInfo.cs" -Encoding utf8
            $out = Join-Path $env:RUNNER_TEMP "out-$ver"
            New-Item -ItemType Directory -Force $out | Out-Null
            & $csc /nologo /target:library /optimize+ /codepage:65001 "/out:$out\FluentTheme.dll" `
              "/resource:$wt\Resources\GS-Logo.png,GS-Logo.png" `
              /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
              "/r:$env:KPEXE" "$wt\Quellcode\*.cs"
            if ($LASTEXITCODE -ne 0) { throw "Kompilieren von v$ver fehlgeschlagen" }
            (Get-Item "$out\FluentTheme.dll").VersionInfo.FileVersion
            gh release create "v$ver" "$out\FluentTheme.dll" --title "Fluent Theme $ver" --notes-file "notes\$ver.md" --target $sha
            if ($LASTEXITCODE -ne 0) {
              # Ältere Stände enthalten eine frühere Fassung dieses Workflows; dort darf das
              # Actions-Token keinen Tag anlegen (HTTP 403). Dann den Tag auf den aktuellen
              # Stand setzen - die DLL bleibt die aus dem Stand dieser Version.
              Write-Host "Tag auf $sha nicht erlaubt - Tag auf aktuellen Stand"
              gh release create "v$ver" "$out\FluentTheme.dll" --title "Fluent Theme $ver" --notes-file "notes\$ver.md" --target $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "Release v$ver konnte nicht angelegt werden" }
            }
          }

      - name: Release-Texte auffrischen
        if: steps.ver.outputs.refresh != ''
        shell: pwsh
        run: |
          foreach ($ver in ('${{ steps.ver.outputs.refresh }}' -split ' ' | Where-Object { $_ })) {
            gh release edit "v$ver" --notes-file "notes\$ver.md"
            if ($LASTEXITCODE -ne 0) { throw "Release-Text v$ver konnte nicht aktualisiert werden" }
          }
